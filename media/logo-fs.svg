<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="52%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="32" y1="24" x2="32" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="100%" stop-color="#bae6fd" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="trendGrad" x1="14" y1="36" x2="50" y2="14" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle background -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="15.25" stroke="url(#rimGrad)" stroke-width="1.5"/>

  <!-- Subtle top sheen -->
  <path d="M12 10C18 6 46 6 52 10C46 18 18 18 12 10Z" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Ascending financial bars -->
  <rect x="14" y="38" width="8.5" height="12" rx="3" fill="url(#barGrad)" fill-opacity="0.78"/>
  <rect x="27.75" y="31" width="8.5" height="19" rx="3" fill="url(#barGrad)" fill-opacity="0.9"/>
  <rect x="41.5" y="23" width="8.5" height="27" rx="3" fill="url(#barGrad)"/>

  <!-- Dynamic upward wealth trend line + arrow -->
  <g filter="url(#glow)">
    <path d="M14.5 31.5L26 23.5L34.5 26.5L48 14.5" stroke="url(#trendGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M40.5 14H48.5V22" stroke="url(#trendGrad)" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
